<!DOCTYPE html>
{%load static%}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <section>
      {%if messages%}
      {%for m in messages%}

      <div class="w-full flex inline-flex justify-between bg-yellow-100 border border-yellow-400 text-yellow-700 px-12 py-3 my-2 rounded  "
      role="alert">
      <span class="block sm:inline pl-2">
         
         {{m}}
      </span>
      <span class="inline" onclick="return this.parentNode.remove();">
          <svg class="fill-current h-6 w-6" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
              <title>Close</title>
              <path
                  d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z" />
          </svg>
      </span>
  </div>


      {%endfor%}
    {%endif%}
    
        <div class="flex items-center justify-center px-4 py-10 sm:px-6 sm:py-16 lg:px-8 lg:py-10">
          <div class="xl:mx-auto xl:w-full xl:max-w-sm 2xl:max-w-md">
            <div class="mb-2 flex justify-center">
              <img class="w-[100px]" src="{%static 'image/cakestudio-logo.jpg'%}" alt="">
            </div>
            <h2 class="text-center text-2xl font-bold leading-tight text-black">
              Sign up to create account
            </h2>
            <p class="mt-2 text-center text-base text-gray-600">
              Already have an account?
              <a
                href="{%url 'sign-in'%}"
                title=""
                class="font-medium text-black transition-all duration-200 hover:underline"
              >
                Sign In
              </a>
            </p>
            <form action="" method="post">
                {%csrf_token%}
                {{form}}
        
                <button 
                class="inline-flex w-full items-center justify-center rounded-md bg-black px-3.5 py-2.5 font-semibold leading-7 text-white hover:bg-black/80"
                 type="submit">register</button>
            </form>
          
          </div>
        </div>
      </section>
      

</body>
</html>
